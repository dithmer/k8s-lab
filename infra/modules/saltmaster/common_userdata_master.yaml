#cloud-config
write_files:
  - path: /etc/salt/minion.d/00-master.conf
    content: |
      master: ${master_addr}
      id: ${hostname}

  - path: /etc/salt/master.d/00-general.conf
    content: |
      state_output: changes

      fileserver_backend:
        - gitfs
      gitfs_provider: gitpython
      gitfs_base: main

      gitfs_saltenv_whitelist:
        - base

      gitfs_remotes:
        - https://github.com/dithmer/k8s-lab.git:
            - name: states
            - base: main
            - root: salt

      git_pillar_provider: gitpython
      git_pillar_base: main

      ext_pillar:
        - git:
            - __env__ https://github.com/dithmer/k8s-lab.git:
                - root: pillar

runcmd:
  - mkdir -p /etc/apt/keyrings
  - curl -fsSL https://packages.broadcom.com/artifactory/api/security/keypair/SaltProjectKey/public | sudo tee /etc/apt/keyrings/salt-archive-keyring.pgp
  - curl -fsSL https://github.com/saltstack/salt-install-guide/releases/latest/download/salt.sources | sudo tee /etc/apt/sources.list.d/salt.sources
  - 'echo "Package: salt-*\nPin: version 3006.*\nPin-Priority: 1001" | sudo tee /etc/apt/preferences.d/salt-pin-1001'
  - apt-get update
  - apt-get install -y salt-minion salt-master

  - /opt/saltstack/salt/bin/python3 -m pip install GitPython

  - truncate -s 0 /etc/salt/minion
  - truncate -s 0 /etc/salt/master

  - systemctl enable salt-master
  - systemctl start salt-master
  - systemctl enable salt-minion
  - systemctl start salt-minion
